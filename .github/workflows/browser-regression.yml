name: browser-regression
'on':
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      image_artifact:
        type: string
        required: true
      image_digest:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  browser-input:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
    steps:
    - &id001
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source_sha }}
    - &id002
      uses: actions/download-artifact@v5
      with:
        name: ${{ inputs.image_artifact }}
        path: image-input
    - &id003
      name: Verify image SPA
      run: python3 -m tools.quality.release_runtime verify-spa --path image-input/web/dist --manifest image-input/browser-build.json
        --sha "$SOURCE_SHA" --image-digest "$IMAGE_DIGEST"
  browser:
    needs: browser-input
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser:
        - chromium
        - firefox
        - webkit
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      RAGFLOW_AXE_SCRIPT: browser-tools/axe.min.js
    steps:
    - name: Set isolated browser artifact path
      env:
        PW_ARTIFACTS_DIR: ${{ runner.temp }}/browser-evidence/${{ matrix.browser }}
      run: printf 'PW_ARTIFACTS_DIR=%s\n' "$PW_ARTIFACTS_DIR" >> "$GITHUB_ENV"
    - *id001
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.13'
        enable-cache: false
    - *id002
    - *id003
    - uses: actions/download-artifact@v5
      with:
        name: browser-tools-${{ github.run_id }}-${{ github.run_attempt }}
        path: browser-tools
    - name: Verify accessibility tool
      run: 'test "$(sha256sum browser-tools/axe.min.js | cut -d'' '' -f1)" = "$(cat browser-tools/axe.sha256)"

        mkdir -p web/dist

        cp -R image-input/web/dist/. web/dist/'
    - name: Install locked browser test dependencies
      run: 'uv export --frozen --only-group test --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/browser-requirements.txt"

        uv venv --python 3.13

        uv pip install --require-hashes -r "$RUNNER_TEMP/browser-requirements.txt"

        .venv/bin/python -m playwright install --with-deps ${{ matrix.browser }}'
    - name: Run isolated browser journeys
      env:
        PYTEST_ADDOPTS: --junitxml=browser-junit.xml
      run: .venv/bin/python test/run_browser_regression.py --browser ${{ matrix.browser }}
    - name: Record successful browser
      run: |
        python3 -m tools.quality.release_runtime browser --path browser-junit.xml --manifest image-input/browser-build.json --browser ${{ matrix.browser }} --sha "$SOURCE_SHA" --output browser-result/${{ matrix.browser }}.json
        cp browser-junit.xml browser-result/${{ matrix.browser }}.xml
    - uses: actions/upload-artifact@v4
      with:
        name: browser-result-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: browser-result
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: browser-failure-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'browser-junit.xml

          ${{ runner.temp }}/browser-evidence'
        if-no-files-found: error
  browser-gate:
    name: browser_regression
    if: always()
    needs:
    - browser-input
    - browser
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
    - *id001
    - *id002
    - name: Require completed browser jobs
      run: 'python3 - <<''PY''

        import json,os

        needs=json.loads(os.environ[''NEEDS_JSON''])

        failed={name:job[''result''] for name,job in needs.items() if job[''result'']!=''success''}

        assert not failed, ''Browser prerequisites/cases failed: ''+json.dumps(failed)

        PY'
    - uses: actions/download-artifact@v5
      with:
        pattern: browser-result-*-${{ github.run_id }}-${{ github.run_attempt }}
        path: browser-results
    - name: Verify every mandatory browser receipt
      run: python3 -m tools.quality.release_runtime verify-browsers --path browser-results --manifest image-input/browser-build.json
        --sha "$SOURCE_SHA"
    - uses: actions/upload-artifact@v4
      with:
        name: browser-results-${{ github.run_id }}-${{ github.run_attempt }}
        path: browser-results
        if-no-files-found: error
