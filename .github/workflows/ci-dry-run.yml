name: CI infrastructure dry-run
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-dry-run-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.packet.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install CI check dependencies
        run: python -m pip install pytest==9.1.1 pytest-asyncio==1.3.0 PyYAML==6.0.3
      - name: Validate workflow syntax and publication boundaries
        run: |
          python -B -m tools.quality.check_release_workflows
          python -B -m pytest -q --confcutdir=test/unit_test/tools/quality test/unit_test/tools/quality/test_check_release_workflows.py test/unit_test/tools/quality/test_release_workflow.py test/unit_test/tools/quality/test_ci_dry_run.py
      - name: Build and export controller fixture
        id: packet
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python -B -m tools.quality.ci_dry_run package --output "$RUNNER_TEMP/ci-packet" --work "$RUNNER_TEMP/ci-build"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ci-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-packet/
          if-no-files-found: error
          retention-days: 3
  verify:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/ci-packet
          merge-multiple: true
      - name: Verify transported image and isolated blue-green update
        env:
          SOURCE_SHA: ${{ github.sha }}
          MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
        run: python -B -m tools.quality.ci_dry_run verify --packet "$RUNNER_TEMP/ci-packet" --output "$RUNNER_TEMP/ci-result" --manifest-sha256 "$MANIFEST_SHA256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-dry-run-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-result/
          if-no-files-found: warn
          retention-days: 7
