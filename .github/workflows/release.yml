name: release
'on':
  schedule:
  - cron: 0 13 * * *
  push:
    tags:
    - v*.*.*
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: Qualify without promotion; use for the two reproducibility runs
      replay_artifact_id:
        type: number
        default: 0
      replay_run_id:
        type: string
        default: ''
      replay_attempt:
        type: number
        default: 1
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      tag: ${{ steps.meta.outputs.tag }}
      nightly: ${{ steps.meta.outputs.nightly }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Resolve trusted release event
      id: meta
      env:
        DRY_RUN: ${{ inputs.dry_run }}
        NIGHTLY_ENABLED: ${{ vars.RELEASE_NIGHTLY_ENABLED }}
      run: "python3 - <<'PY'\nfrom datetime import datetime,timezone\nimport os,re,tomllib\nnightly=os.environ['GITHUB_EVENT_NAME']!='push'\n\
        ref=os.environ['GITHUB_REF']\nif not nightly:\n    tag=ref.removeprefix('refs/tags/')\n    assert re.fullmatch(r'v\\\
        d+\\.\\d+\\.\\d+',tag), 'unsupported stable tag'\n    version=tomllib.load(open('pyproject.toml','rb'))['project']['version']\n\
        \    assert tag=='v'+version, 'stable tag/project version mismatch'\n    publish=True\nelse:\n    assert ref=='refs/heads/main',\
        \ 'nightly is only qualified from main'\n    tag='nightly-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']\n\
        \    publish=(os.environ['GITHUB_EVENT_NAME']=='schedule' and os.environ['NIGHTLY_ENABLED']=='true') or (os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'\
        \ and os.environ['DRY_RUN']=='false')\nwith open(os.environ['GITHUB_OUTPUT'],'a') as out:\n    out.write(f'publish={str(publish).lower()}\\\
        ntag={tag}\\nnightly={str(nightly).lower()}\\n')\nPY"
    - name: Require configured infrastructure
      env:
        GH_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
        PUBLISH: ${{ steps.meta.outputs.publish }}
      run: "if [[ \"$PUBLISH\" == true ]]; then\n  python3 -m tools.quality.release_runtime ready --roles ragflow-test ragflow-release\nelse\n\
        \  python3 -m tools.quality.release_runtime ready\nfi"
  qualification:
    needs: prepare
    uses: ./.github/workflows/tests.yml
    with:
      profile: release
      source_sha: ${{ github.sha }}
      replay_artifact_id: ${{ inputs.replay_artifact_id || 0 }}
      replay_run_id: ${{ inputs.replay_run_id || '' }}
      replay_attempt: ${{ inputs.replay_attempt || 1 }}
    secrets:
      RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
      NEXUS_STAGING_BUILD_USER: ${{ secrets.NEXUS_STAGING_BUILD_USER }}
      NEXUS_STAGING_BUILD_PASSWORD: ${{ secrets.NEXUS_STAGING_BUILD_PASSWORD }}
      NEXUS_STAGING_READ_USER: ${{ secrets.NEXUS_STAGING_READ_USER }}
      NEXUS_STAGING_READ_PASSWORD: ${{ secrets.NEXUS_STAGING_READ_PASSWORD }}
      NEXUS_RELEASE_READ_USER: ${{ secrets.NEXUS_RELEASE_READ_USER }}
      NEXUS_RELEASE_READ_PASSWORD: ${{ secrets.NEXUS_RELEASE_READ_PASSWORD }}
  publish_ready:
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    needs: [prepare, qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Recheck publisher after qualification
      env:
        GH_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
      run: python3 -m tools.quality.release_runtime ready --roles ragflow-release
  publish:
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    needs:
    - prepare
    - qualification
    - publish_ready
    runs-on:
    - self-hosted
    - ragflow-release
    - Linux
    - ragflow-isolated-vm
    timeout-minutes: 60
    environment: internal-release
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-publication
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
      QUALIFICATION_SHA256: ${{ needs.qualification.outputs.receipt_sha256 }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ vars.RELEASE_PUBLISHER_SHA }}
        fetch-depth: 0
        persist-credentials: false
    - name: Require pinned trusted publisher
      env:
        PUBLISHER_SHA: ${{ vars.RELEASE_PUBLISHER_SHA }}
      run: 'test "${#PUBLISHER_SHA}" = 40

        test "$(git rev-parse HEAD)" = "$PUBLISHER_SHA"

        git merge-base --is-ancestor "$PUBLISHER_SHA" origin/main

        git merge-base --is-ancestor "$SOURCE_SHA" origin/main'
    - name: Initialize publication result
      run: printf '%s\n' '{"status":"INCOMPLETE","stage":"origin-check"}' > publication-result.json
    - name: Acquire qualification by immutable artifact ID
      env:
        ARTIFACT_ID: ${{ needs.qualification.outputs.artifact_id }}
        QUALIFICATION_ATTEMPT: ${{ needs.qualification.outputs.qualification_attempt }}
        ARTIFACT_NAME: ${{ needs.qualification.outputs.artifact }}
      run: "python3 -m tools.quality.release_origin --repository \"$GITHUB_REPOSITORY\" --run-id \"$GITHUB_RUN_ID\" --attempt\
        \ \"$QUALIFICATION_ATTEMPT\" --artifact-id \"$ARTIFACT_ID\" --name \"$ARTIFACT_NAME\" --sha \"$SOURCE_SHA\" --output\
        \ qualified\npython3 - <<'PY'\nimport json,os\nfrom pathlib import Path\norigin=json.loads(Path('qualified/artifact-origin.json').read_text())\n\
        with open(os.environ['GITHUB_ENV'],'a') as out:\n    out.write('QUALIFICATION_ARTIFACT_ORIGIN='+json.dumps(origin,separators=(',',':'))+'\\\
        n')\nPY"
    - name: Verify receipt digest
      env:
        RECEIPT_SHA256: ${{ needs.qualification.outputs.receipt_sha256 }}
      run: |
        test "$(sha256sum qualified/candidate-receipt.json | cut -d' ' -f1)" = "$RECEIPT_SHA256"
    - name: Promote qualified artifacts
      env:
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        NIGHTLY: ${{ needs.prepare.outputs.nightly }}
        NEXUS_RELEASE_USER: ${{ secrets.NEXUS_RELEASE_USER }}
        NEXUS_RELEASE_PASSWORD: ${{ secrets.NEXUS_RELEASE_PASSWORD }}
        NEXUS_STAGING_USER: ${{ secrets.NEXUS_STAGING_USER }}
        NEXUS_STAGING_PASSWORD: ${{ secrets.NEXUS_STAGING_PASSWORD }}
      run: 'args=()

        [[ "$NIGHTLY" != true ]] || args+=(--nightly)

        python3 -m tools.quality.release_publish --receipt qualified/candidate-receipt.json --packet qualified/qualification
        --tag "$RELEASE_TAG" "${args[@]}"'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: publication-${{ github.run_id }}-${{ github.run_attempt }}
        path: publication-result.json
        if-no-files-found: error
