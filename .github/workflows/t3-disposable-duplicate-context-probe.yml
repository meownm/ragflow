name: t3-disposable-duplicate-context-probe

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  duplicate:
    name: architecture-policy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Complete after the trusted negative check
        shell: bash
        run: |
          sleep 50
          echo "Disposable duplicate context probe only; never merge this branch."
