name: tests
permissions:
  contents: read
  actions: read
'on':
  workflow_call:
    inputs:
      profile:
        type: string
        default: targeted
      source_sha:
        type: string
        default: ''
      replay_artifact_id:
        type: number
        default: 0
      replay_run_id:
        type: string
        default: ''
      replay_attempt:
        type: number
        default: 1
    secrets:
      RUNNER_READ_TOKEN:
        required: true
      NEXUS_STAGING_BUILD_USER:
        required: true
      NEXUS_STAGING_BUILD_PASSWORD:
        required: true
      NEXUS_STAGING_READ_USER:
        required: true
      NEXUS_STAGING_READ_PASSWORD:
        required: true
      NEXUS_RELEASE_READ_USER:
        required: true
      NEXUS_RELEASE_READ_PASSWORD:
        required: true
    outputs:
      receipt_sha256:
        value: ${{ jobs.evidence.outputs.receipt_sha256 }}
      artifact:
        value: ${{ jobs.evidence.outputs.artifact }}
      artifact_id:
        value: ${{ jobs.evidence.outputs.artifact_id }}
      qualification_attempt:
        value: ${{ jobs.evidence.outputs.qualification_attempt }}
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options:
        - targeted
        - release
        default: targeted
      source_sha:
        type: string
        default: ''
      replay_artifact_id:
        type: number
        default: 0
      replay_run_id:
        type: string
        default: ''
      replay_attempt:
        type: number
        default: 1
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
jobs:
  ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - &id002
      uses: actions/checkout@v6
      with: &id001
        ref: ${{ inputs.source_sha || github.sha }}
        fetch-depth: 0
        fetch-tags: true
    - name: Require test runner
      env:
        GH_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
      run: python3 -m tools.quality.release_runtime ready
    - name: Validate qualification source and configuration
      env:
        PROFILE: ${{ inputs.profile || 'targeted' }}
        SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        RELEASE_IMAGE_REPOSITORY: ${{ vars.RELEASE_IMAGE_REPOSITORY }}
        STAGING_IMAGE_REPOSITORY: ${{ vars.STAGING_IMAGE_REPOSITORY }}
        DEEPDOC_IMAGE: ${{ vars.RAGFLOW_CI_DEEPDOC_IMAGE }}
        PREVIOUS_RELEASE_TAG: ${{ vars.RAGFLOW_PREVIOUS_QUALIFIED_RELEASE }}
        INITIAL_BOOTSTRAP: ${{ vars.RELEASE_BOOTSTRAP_ENABLED }}
      run: |
        set -euo pipefail
        test -n "$STAGING_IMAGE_REPOSITORY" || { echo '::error::Missing STAGING_IMAGE_REPOSITORY'; exit 1; }
        test -n "$DEEPDOC_IMAGE" || { echo '::error::Missing published RAGFLOW_CI_DEEPDOC_IMAGE'; exit 1; }
        if [[ "$PROFILE" == release ]]; then
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test -n "$RELEASE_IMAGE_REPOSITORY" || { echo '::error::Missing RELEASE_IMAGE_REPOSITORY'; exit 1; }
          test -n "$PREVIOUS_RELEASE_TAG" || [[ "$INITIAL_BOOTSTRAP" == true ]] || { echo '::error::INCOMPLETE: previous qualified baseline or approved initial bootstrap is not configured'; exit 1; }
        fi
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci')) }}
  ragflow_preflight:
    name: ragflow_preflight
    runs-on:
    - self-hosted
    - ragflow-test
    - Linux
    - ragflow-isolated-vm
    services:
      regression-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: regression
          POSTGRES_PASSWORD: regression-only
          POSTGRES_DB: regression
        ports:
        - 5432/tcp
        options: --health-cmd "pg_isready -U regression -d regression" --health-interval 5s --health-timeout 5s --health-retries
          10
    outputs:
      http_api_test_level: ${{ steps.test_level.outputs.http_api_test_level }}
      has_go_changes: ${{ steps.detect_changes.outputs.has_go_changes }}
      run_engine_tests: ${{ steps.engine_tests.outputs.run_engine_tests }}
      engine_test_reason: ${{ steps.engine_tests.outputs.engine_test_reason }}
    steps:
    - &id003
      uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.13'
        enable-cache: false
    - name: Ensure workspace ownership
      run: 'echo "Workflow triggered by ${{ github.event_name }}"

        echo "chown -R $(id -un) ${GITHUB_WORKSPACE}" && sudo chown -R $(id -un) ${GITHUB_WORKSPACE}

        '
    - name: Check out code
      uses: actions/checkout@v6
      with: *id001
    - name: Prepare artifacts directory
      run: 'set -euo pipefail

        ARTIFACTS_DIR="${RUNNER_WORKSPACE_PREFIX:-${HOME}}/artifacts/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/preflight"

        echo "ARTIFACTS_DIR=${ARTIFACTS_DIR}" >> "${GITHUB_ENV}"

        test -n "${ARTIFACTS_DIR}"

        mkdir -p -- "${ARTIFACTS_DIR}"

        '
    - name: Run Lefthook on changed files
      run: "set -euo pipefail\nuv tool install --force ruff==0.13.3\nexport PATH=\"$HOME/.local/bin:$PATH\"\nif [[ \"${GITHUB_EVENT_NAME}\"\
        \ == \"pull_request\" || \"${GITHUB_EVENT_NAME}\" == \"pull_request_target\" ]]; then\n  changed_files=$(mktemp)\n\
        \  trap 'rm -f \"$changed_files\"' EXIT\n  git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha\
        \ }} \\\n    | while read -r file; do\n        if [[ -f \"$file\" ]]; then\n          printf '%s\\0' \"$file\"\n \
        \       fi\n      done > \"$changed_files\"\n  echo \"Changed files to run lefthook on:\"\n  if [[ -s \"$changed_files\"\
        \ ]]; then\n    tr '\\0' '\\n' < \"$changed_files\" | sed 's/^/  /'\n  else\n    echo \"  (none \u0432\u0402\u201D\
        \ lefthook will be a no-op)\"\n  fi\n  # LEFTHOOK_CHECK_ONLY=1 makes the pre-commit jobs verify without\n  # applying\
        \ --fix or `git add`, so CI only checks and reports\n  # failures instead of rewriting the working tree.\n  python3\
        \ tools/hooks/prepare_web.py --files-from \"$changed_files\"\n  LEFTHOOK_CHECK_ONLY=1 lefthook run pre-commit --files-from-stdin\
        \ --no-auto-install < \"$changed_files\"\nfi\n"
    - name: Set test level
      id: test_level
      run: "set -euo pipefail\nif [[ \"${QUALIFICATION_PROFILE}\" == \"release\" ]]; then\n  export HTTP_API_TEST_LEVEL=p3\n\
        else\n  export HTTP_API_TEST_LEVEL=p2\nfi\necho \"HTTP_API_TEST_LEVEL=${HTTP_API_TEST_LEVEL}\" >> ${GITHUB_ENV}\n\
        echo \"http_api_test_level=${HTTP_API_TEST_LEVEL}\" >> ${GITHUB_OUTPUT}\n"
    - name: Detect changed file types
      id: detect_changes
      env:
        CI_BEFORE: ${{ github.event.before }}
        CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
      run: bash deployment/runner/select-ci-lanes.sh
    - name: Select engine regression
      id: engine_tests
      env:
        GH_TOKEN: ${{ github.token }}
        CI_WORKFLOW_FILE: release.yml
        CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        QUALIFICATION_PROFILE: ${{ inputs.profile || 'targeted' }}
      run: python3 tools/quality/select_engine_tests.py
    - name: Prepare Python test environment
      run: 'sudo apt-get update

        sudo apt-get install -y --no-install-recommends libglib2.0-0 libglx-mesa0 libgl1

        uv sync --python 3.13 --group test --frozen

        uv pip install -e sdk/python

        '
    - name: Run unit test
      run: 'source .venv/bin/activate

        which pytest || echo "pytest not in PATH"

        echo "Start to run unit test"

        python3 run_tests.py -i

        '
    - name: Verify required local models before product build
      if: ${{ inputs.profile == 'release' || steps.engine_tests.outputs.run_engine_tests == 'true' }}
      env:
        RAGFLOW_TEST_OLLAMA_URL: ${{ vars.RAGFLOW_CI_OLLAMA_URL }}
      run: python3 -m tools.quality.release_runtime models --output models-prerequisite.json
    - name: Business document branch coverage gate
      run: 'source .venv/bin/activate

        pytest test/unit_test/business_documents test/unit_test/api/apps/business_documents test/unit_test/api/apps/restful_apis/test_business_document_api_contract.py
        --cov=api/apps/business_documents --cov=business_documents --cov-branch --cov-fail-under=79 --cov-report=xml:coverage-business-documents.xml

        python3 -c ''from pathlib import Path; from tools.quality.release_evidence import verify_branch_coverage; print(verify_branch_coverage(Path("coverage-business-documents.xml")))''

        '
    - name: Deterministic business document requirements
      run: 'source .venv/bin/activate

        pytest test/evals/business_documents/test_golden_dialogue_harness.py test/evals/business_documents/test_live_quality_scorer.py
        test/evals/source_workbench/test_evaluate.py test/evals/source_workbench/test_live_provisioning.py

        '
    - name: SQL project golden requirements
      env:
        SQL_PROJECT_TEST_DISPOSABLE: '1'
        SQL_PROJECT_TEST_POSTGRES_DSN: postgresql://regression:regression-only@127.0.0.1:${{ job.services.regression-postgres.ports['5432'] }}/regression
      run: |
        set -euo pipefail
        source .venv/bin/activate
        python -B -m pytest -q test/evals/sql_projects test/integration/test_sql_projects_postgres.py test/integration/test_sql_result_retention_postgres.py --junitxml=sql-project-goldens.xml
    - name: PostgreSQL transaction races
      env:
        BUSINESS_DOCUMENT_TEST_POSTGRES_DSN: postgresql://regression:regression-only@host.docker.internal:${{ job.services.regression-postgres.ports['5432']
          }}/regression
      run: "set -euo pipefail\nsource .venv/bin/activate\nminio_name=\"business-documents-minio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\
        \ncleanup_minio() { docker rm -f \"${minio_name}\" >/dev/null 2>&1 || true; }\ntrap cleanup_minio EXIT\ndocker run\
        \ --rm -d --name \"${minio_name}\" --label codex.lane=business-document-export \\\n  -p 127.0.0.1::9000 \\\n  -e MINIO_ROOT_USER=regression\
        \ \\\n  -e MINIO_ROOT_PASSWORD=regression-only-minio \\\n  pgsty/minio:RELEASE.2026-03-25T00-00-00Z server /data >/dev/null\n\
        minio_endpoint=\"$(docker port \"${minio_name}\" 9000/tcp)\"\nfor _ in $(seq 1 80); do\n  if curl --noproxy '*' -fsS\
        \ \"http://${minio_endpoint}/minio/health/ready\" >/dev/null; then\n    break\n  fi\n  sleep 0.25\ndone\ncurl --noproxy\
        \ '*' -fsS \"http://${minio_endpoint}/minio/health/ready\" >/dev/null\nexport BUSINESS_DOCUMENT_TEST_MINIO_ENDPOINT=\"\
        http://${minio_endpoint}\"\nexport BUSINESS_DOCUMENT_TEST_MINIO_USER=regression\nexport BUSINESS_DOCUMENT_TEST_MINIO_PASSWORD=regression-only-minio\n\
        pytest test/integration/test_business_document_postgres.py\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: preflight-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          coverage-business-documents.xml
          sql-project-goldens.xml
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
    needs:
    - ready
    - replay
    timeout-minutes: 45
    env:
      QUALIFICATION_PROFILE: ${{ inputs.profile || 'targeted' }}
  frontend:
    runs-on: ubuntu-24.04
    needs:
    - ready
    - replay
    timeout-minutes: 30
    steps:
    - *id002
    - name: Validate release workflows
      run: 'python3 -m pip install PyYAML==6.0.2

        python3 -m tools.quality.check_release_workflows'
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - name: Locked frontend tests and accessibility tool
      working-directory: web
      run: 'pnpm install --frozen-lockfile

        pnpm test --runInBand

        mkdir -p ../browser-tools

        cp node_modules/axe-core/axe.min.js ../browser-tools/axe.min.js

        sha256sum ../browser-tools/axe.min.js | cut -d'' '' -f1 > ../browser-tools/axe.sha256'
    - uses: actions/upload-artifact@v4
      with:
        name: browser-tools-${{ github.run_id }}-${{ github.run_attempt }}
        path: browser-tools
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
  package_python:
    runs-on: ubuntu-24.04
    needs:
    - ready
    - replay
    timeout-minutes: 20
    steps:
    - *id002
    - *id003
    - uses: actions/download-artifact@v5
      if: ${{ needs.replay.outputs.artifact != '' }}
      with:
        artifact-ids: ${{ needs.replay.outputs.artifact }}
        path: replay
    - name: Build wheel distributions
      run: "mkdir -p \"$RUNNER_TEMP/wheels\"\nif [[ -d replay/qualification/python ]]; then\n  cp replay/qualification/python/*.whl\
        \ \"$RUNNER_TEMP/wheels/\"\nelse\n  uv build --wheel --out-dir \"$RUNNER_TEMP/wheels\" sdk/python\n  uv build --wheel\
        \ --out-dir \"$RUNNER_TEMP/wheels\" admin/client\nfi\nuv venv --python 3.13 \"$RUNNER_TEMP/wheel-test\"\nuv pip install\
        \ --python \"$RUNNER_TEMP/wheel-test/bin/python\" \"$RUNNER_TEMP\"/wheels/*.whl\n(cd \"$RUNNER_TEMP\" && \"$RUNNER_TEMP/wheel-test/bin/python\"\
        \ -c 'import ragflow_sdk, ragflow_cli')"
    - uses: actions/upload-artifact@v4
      with:
        name: python-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/wheels/*.whl
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
  build_cli:
    needs:
    - ready
    - replay
    if: ${{ inputs.profile == 'release' }}
    uses: ./.github/workflows/release-cli.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      replay_artifact: ${{ needs.replay.outputs.artifact }}
  build_image:
    runs-on:
    - self-hosted
    - ragflow-test
    - Linux
    - ragflow-isolated-vm
    needs:
    - ragflow_preflight
    - frontend
    - replay
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      lock_sha256: ${{ steps.lock.outputs.sha256 }}
      postgres: ${{ steps.lock.outputs.postgres }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      STAGING_IMAGE: ${{ vars.STAGING_IMAGE_REPOSITORY }}:${{ inputs.source_sha || github.sha }}-${{ github.run_id }}-${{
        github.run_attempt }}
      REPLAY_IMAGE: ${{ needs.replay.outputs.digest }}
      DEEPDOC_IMAGE: ${{ vars.RAGFLOW_CI_DEEPDOC_IMAGE }}
    steps:
    - *id002
    - *id003
    - uses: actions/download-artifact@v5
      if: ${{ needs.replay.outputs.artifact != '' }}
      with:
        artifact-ids: ${{ needs.replay.outputs.artifact }}
        path: replay
    - name: Build native binaries
      run: |
        set -euo pipefail
        bash deployment/runner/build-go-linux.sh --artifacts
    - name: Go regression
      if: ${{ inputs.profile == 'release' || needs.ragflow_preflight.outputs.has_go_changes == 'true' }}
      env:
        RAGFLOW_TEST_DOCKER_HOST: host.docker.internal
        RAGFLOW_TEST_BIND_ADDRESS: 0.0.0.0
      run: bash test/run_go_regression.sh
    - name: Compile native parser checks with repository wrapper
      run: 'mkdir -p output/ci-native

        bash deployment/runner/build-go-linux.sh --test -c -o output/ci-native/parser.test ./internal/parser/parser'
    - name: Build one image and extract SPA
      id: image
      env:
        STAGING_IMAGE_REPOSITORY: ${{ vars.STAGING_IMAGE_REPOSITORY }}
        NEXUS_STAGING_BUILD_USER: ${{ secrets.NEXUS_STAGING_BUILD_USER }}
        NEXUS_STAGING_BUILD_PASSWORD: ${{ secrets.NEXUS_STAGING_BUILD_PASSWORD }}
      run: bash deployment/runner/build-qualified-image.sh
    - name: Freeze supporting runtime images
      id: lock
      env:
        RAGFLOW_IMAGE: ${{ steps.image.outputs.digest }}
      run: "test -n \"$DEEPDOC_IMAGE\"\nif [[ -f replay/qualification/runtime-images.json ]]; then\n  python3 - <<'PY'\nimport\
        \ json,os\nfrom pathlib import Path\nfrom tools.quality.runtime_image_lock import identity,serialize\nlock=json.loads(Path('replay/qualification/runtime-images.json').read_text())\n\
        assert lock['candidate_image']==os.environ['RAGFLOW_IMAGE']\nlock.update(identity(os.environ['GITHUB_REPOSITORY'],os.environ['SOURCE_SHA'],os.environ['GITHUB_RUN_ID'],int(os.environ['GITHUB_RUN_ATTEMPT'])))\n\
        Path('output/ci-image/runtime-images.json').write_bytes(serialize(lock))\nPY\nelse\n  python3 -m tools.quality.runtime_image_lock\
        \ build --lock output/ci-image/runtime-images.json --candidate-image \"$RAGFLOW_IMAGE\"\nfi\nprintf 'sha256=%s\\n'\
        \ \"$(sha256sum output/ci-image/runtime-images.json | cut -d' ' -f1)\" >> \"$GITHUB_OUTPUT\"\npython3 - <<'PY'\nimport\
        \ json,os\nfrom pathlib import Path\nlock=json.loads(Path('output/ci-image/runtime-images.json').read_text())\nwith\
        \ open(os.environ['GITHUB_OUTPUT'],'a') as out:\n    out.write('postgres='+lock['services']['elasticsearch']['postgres']['image']+'\\\
        n')\nPY"
    - name: Qualify native binaries inside final image
      env:
        RAGFLOW_IMAGE: ${{ steps.image.outputs.digest }}
      run: bash deployment/runner/test-native-image.sh output/ci-native/parser.test output/ci-image/native
    - name: Qualify blue-green HTTP transition and rejected candidate
      env:
        RAGFLOW_TEST_DISPOSABLE: '1'
      run: >-
        python3 deployment/runner/test-blue-green.py
        --image '${{ steps.image.outputs.digest }}'
        --output output/ci-image/blue-green
    - name: Qualify previous image upgrade and restore
      env:
        RAGFLOW_IMAGE: ${{ steps.image.outputs.digest }}
        RAGFLOW_TEST_DISPOSABLE: '1'
        RAGFLOW_QUALIFICATION_POSTGRES_IMAGE: ${{ steps.lock.outputs.postgres }}
        PREVIOUS_RELEASE_TAG: ${{ vars.RAGFLOW_PREVIOUS_QUALIFIED_RELEASE }}
        INITIAL_BOOTSTRAP: ${{ vars.RELEASE_BOOTSTRAP_ENABLED }}
        RELEASE_IMAGE_REPOSITORY: ${{ vars.RELEASE_IMAGE_REPOSITORY }}
        NEXUS_RELEASE_READ_USER: ${{ secrets.NEXUS_RELEASE_READ_USER }}
        NEXUS_RELEASE_READ_PASSWORD: ${{ secrets.NEXUS_RELEASE_READ_PASSWORD }}
        STAGING_IMAGE_REPOSITORY: ${{ vars.STAGING_IMAGE_REPOSITORY }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        args=()
        if [[ -n "$PREVIOUS_RELEASE_TAG" ]]; then
          source deployment/runner/staging-docker-auth.sh
          authenticate_previous_release_read
          args+=(--previous-tag "$PREVIOUS_RELEASE_TAG")
        elif [[ "$INITIAL_BOOTSTRAP" == true ]]; then
          mapfile -t baseline < <(python3 - <<'PY'
        import json
        from tools.quality.release_evidence import BOOTSTRAP_BASELINE
        data=json.loads(BOOTSTRAP_BASELINE.read_bytes())
        print(data['image_digest'])
        print(data['source_sha'])
        print(data['repository'])
        PY
          )
          test "${#baseline[@]}" = 3
          args+=(--bootstrap --historical-image "${baseline[0]}" --historical-sha "${baseline[1]}" --baseline-repository "${baseline[2]}")
        else
          echo '::error::INCOMPLETE: runtime baseline unavailable'
          exit 1
        fi
        python3 deployment/runner/test-qualified-upgrade.py "${args[@]}" --output output/ci-image/upgrade
      if: ${{ inputs.profile == 'release' }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: image-${{ github.run_id }}-${{ github.run_attempt }}
        path: output/ci-image
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
    - name: Remove owned staging credentials
      if: always()
      run: bash deployment/runner/staging-docker-auth.sh cleanup
  ragflow_tests_infinity:
    name: ragflow_tests_infinity
    needs:
    - ragflow_preflight
    - build_image
    - package_python
    if: ${{ needs.ragflow_preflight.outputs.run_engine_tests == 'true' }}
    runs-on:
    - self-hosted
    - ragflow-test
    - Linux
    - ragflow-isolated-vm
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      DOC_ENGINE: infinity
      RAGFLOW_IMAGE: ${{ needs.build_image.outputs.digest }}
      HTTP_API_TEST_LEVEL: ${{ needs.ragflow_preflight.outputs.http_api_test_level }}
      RAGFLOW_TEST_OLLAMA_URL: ${{ vars.RAGFLOW_CI_OLLAMA_URL }}
      RAGFLOW_TEST_DISPOSABLE: '1'
      E2E_ADMIN_EMAIL: admin@ragflow.io
      E2E_ADMIN_PASSWORD: admin
      RAGFLOW_E2E_OAUTH: '1'
      DEEPDOC_IMAGE: ${{ vars.RAGFLOW_CI_DEEPDOC_IMAGE }}
      RUNTIME_IMAGE_LOCK_SHA256: ${{ needs.build_image.outputs.lock_sha256 }}
    steps:
    - *id002
    - *id003
    - uses: actions/download-artifact@v5
      with:
        name: python-${{ github.run_id }}-${{ github.run_attempt }}
        path: output/ci-wheels
    - name: Prepare locked test environment
      run: 'sudo apt-get update

        sudo apt-get install -y --no-install-recommends libglib2.0-0 libglx-mesa0 libgl1

        uv sync --python 3.13 --group test --frozen

        uv pip install output/ci-wheels/*.whl

        '
    - uses: actions/download-artifact@v5
      with:
        name: image-${{ github.run_id }}-${{ github.run_attempt }}
        path: output/ci-image
    - name: Prepare isolated stack
      working-directory: docker
      env:
        STAGING_IMAGE_REPOSITORY: ${{ vars.STAGING_IMAGE_REPOSITORY }}
        NEXUS_STAGING_READ_USER: ${{ secrets.NEXUS_STAGING_READ_USER }}
        NEXUS_STAGING_READ_PASSWORD: ${{ secrets.NEXUS_STAGING_READ_PASSWORD }}
      run: bash ../deployment/runner/prepare-engine.sh
    - name: Materialize verified runtime image lock
      run: 'override="$RUNNER_TEMP/runtime-images.override.json"

        python3 -m tools.quality.runtime_image_lock materialize --lock output/ci-image/runtime-images.json --lock-sha256 "$RUNTIME_IMAGE_LOCK_SHA256"
        --candidate-image "$RAGFLOW_IMAGE" --engine "$DOC_ENGINE" --env-file "$CI_ENV_FILE" --output "$override"

        printf ''RUNTIME_IMAGE_OVERRIDE=%s\n'' "$override" >> "$GITHUB_ENV"'
    - name: Run qualified engine scenarios
      run: bash deployment/runner/test-engine.sh
    - name: Cleanup owned stack
      if: always()
      run: bash deployment/runner/cleanup-engine.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: engine-infinity-${{ github.run_id }}-${{ github.run_attempt }}
        path: output/ci-engine
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
  ragflow_tests_elasticsearch:
    name: ragflow_tests_elasticsearch
    needs:
    - ragflow_preflight
    - build_image
    - package_python
    if: ${{ needs.ragflow_preflight.outputs.run_engine_tests == 'true' }}
    runs-on:
    - self-hosted
    - ragflow-test
    - Linux
    - ragflow-isolated-vm
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      DOC_ENGINE: elasticsearch
      RAGFLOW_IMAGE: ${{ needs.build_image.outputs.digest }}
      HTTP_API_TEST_LEVEL: ${{ needs.ragflow_preflight.outputs.http_api_test_level }}
      RAGFLOW_TEST_OLLAMA_URL: ${{ vars.RAGFLOW_CI_OLLAMA_URL }}
      RAGFLOW_TEST_DISPOSABLE: '1'
      E2E_ADMIN_EMAIL: admin@ragflow.io
      E2E_ADMIN_PASSWORD: admin
      RAGFLOW_E2E_OAUTH: '1'
      DEEPDOC_IMAGE: ${{ vars.RAGFLOW_CI_DEEPDOC_IMAGE }}
      RUNTIME_IMAGE_LOCK_SHA256: ${{ needs.build_image.outputs.lock_sha256 }}
    steps:
    - *id002
    - *id003
    - uses: actions/download-artifact@v5
      with:
        name: python-${{ github.run_id }}-${{ github.run_attempt }}
        path: output/ci-wheels
    - name: Prepare locked test environment
      run: 'sudo apt-get update

        sudo apt-get install -y --no-install-recommends libglib2.0-0 libglx-mesa0 libgl1

        uv sync --python 3.13 --group test --frozen

        uv pip install output/ci-wheels/*.whl

        '
    - uses: actions/download-artifact@v5
      with:
        name: image-${{ github.run_id }}-${{ github.run_attempt }}
        path: output/ci-image
    - name: Prepare isolated stack
      working-directory: docker
      env:
        STAGING_IMAGE_REPOSITORY: ${{ vars.STAGING_IMAGE_REPOSITORY }}
        NEXUS_STAGING_READ_USER: ${{ secrets.NEXUS_STAGING_READ_USER }}
        NEXUS_STAGING_READ_PASSWORD: ${{ secrets.NEXUS_STAGING_READ_PASSWORD }}
      run: bash ../deployment/runner/prepare-engine.sh
    - name: Materialize verified runtime image lock
      run: 'override="$RUNNER_TEMP/runtime-images.override.json"

        python3 -m tools.quality.runtime_image_lock materialize --lock output/ci-image/runtime-images.json --lock-sha256 "$RUNTIME_IMAGE_LOCK_SHA256"
        --candidate-image "$RAGFLOW_IMAGE" --engine "$DOC_ENGINE" --env-file "$CI_ENV_FILE" --output "$override"

        printf ''RUNTIME_IMAGE_OVERRIDE=%s\n'' "$override" >> "$GITHUB_ENV"'
    - name: Run qualified engine scenarios
      run: bash deployment/runner/test-engine.sh
    - name: Cleanup owned stack
      if: always()
      run: bash deployment/runner/cleanup-engine.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: engine-elasticsearch-${{ github.run_id }}-${{ github.run_attempt }}
        path: output/ci-engine
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
  browser_regression:
    needs:
    - build_image
    - frontend
    uses: ./.github/workflows/browser-regression.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      image_artifact: image-${{ github.run_id }}-${{ github.run_attempt }}
      image_digest: ${{ needs.build_image.outputs.digest }}
  evidence:
    if: always()
    needs:
    - ready
    - ragflow_preflight
    - frontend
    - package_python
    - build_cli
    - build_image
    - ragflow_tests_infinity
    - ragflow_tests_elasticsearch
    - browser_regression
    - replay
    runs-on: ubuntu-24.04
    outputs:
      receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
      artifact: qualification-${{ github.run_id }}-${{ github.run_attempt }}
      artifact_id: ${{ steps.qualified.outputs.artifact-id }}
      qualification_attempt: ${{ github.run_attempt }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      NEEDS_JSON: ${{ toJSON(needs) }}
      RELEASE_IMAGE_REPOSITORY: ${{ vars.RELEASE_IMAGE_REPOSITORY }}
      PROFILE: ${{ inputs.profile || 'targeted' }}
      EXPECTED_BUNDLE_ID: ${{ needs.replay.outputs.bundle_id }}
    steps:
    - *id002
    - name: Record qualification outcome even without artifacts
      run: 'python3 - <<''PY''

        import json,os

        from pathlib import Path

        from tools.quality.release_evidence import qualification_status,RELEASE_LANES

        needs=json.loads(os.environ[''NEEDS_JSON''])

        status=qualification_status({name:needs.get(name,{}).get(''result'') for name in RELEASE_LANES})

        Path(''qualification-summary.json'').write_text(json.dumps({''schema'':2,''purpose'':''qualification-outcome'',''profile'':os.environ[''PROFILE''],''status'':status,''jobs'':needs,''publication_eligible'':False}))

        PY'
    - name: Report targeted qualification
      if: ${{ env.PROFILE == 'targeted' }}
      run: 'python3 - <<''PY''

        import json,os

        from pathlib import Path

        from tools.quality.release_evidence import qualification_status

        needs=json.loads(os.environ[''NEEDS_JSON''])

        status=qualification_status({k:v[''result''] for k,v in needs.items()},[k for k in needs if k not in (''build_cli'',)])

        Path(''qualification-summary.json'').write_text(json.dumps({''profile'':''targeted'',''status'':status,''publication_eligible'':False,''jobs'':needs}))

        assert not any(v[''result''] in (''failure'',''cancelled'') for v in needs.values()), ''targeted lane failed''

        PY'
    - name: Acquire and verify every qualification producer
      if: ${{ env.PROFILE == 'release' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -m tools.quality.release_origin --producers --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$SOURCE_SHA" --output incoming --origin-output producer-origins.json
    - name: Assemble closed qualification packet
      if: ${{ env.PROFILE == 'release' }}
      run: python3 -m tools.quality.release_packet incoming output/qualification
    - name: Create qualification receipt
      id: receipt
      if: ${{ env.PROFILE == 'release' }}
      run: 'python3 -m tools.quality.release_runtime receipt --path output/qualification --output output/candidate-receipt.json

        printf ''sha256=%s

        '' "$(sha256sum output/candidate-receipt.json | cut -d'' '' -f1)" >> "$GITHUB_OUTPUT"'
    - uses: actions/upload-artifact@v4
      if: ${{ env.PROFILE == 'release' }}
      with:
        name: qualification-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'output/qualification

          output/candidate-receipt.json'
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
      id: qualified
    - uses: actions/upload-artifact@v4
      if: ${{ env.PROFILE == 'targeted' }}
      with:
        name: qualification-summary-${{ github.run_id }}-${{ github.run_attempt }}
        path: qualification-summary.json
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ always() && env.PROFILE == 'release' }}
      with:
        name: qualification-summary-${{ github.run_id }}-${{ github.run_attempt }}
        path: qualification-summary.json
        if-no-files-found: error
  replay:
    needs: ready
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.replay.outputs.digest }}
      bundle_id: ${{ steps.replay.outputs.bundle_id }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source_sha || github.sha }}
    - id: replay
      if: ${{ inputs.replay_artifact_id != 0 && inputs.replay_artifact_id != null }}
      env:
        ARTIFACT_ID: ${{ inputs.replay_artifact_id }}
        REPLAY_RUN: ${{ inputs.replay_run_id }}
        REPLAY_ATTEMPT: ${{ inputs.replay_attempt }}
      run: python3 -m tools.quality.release_replay --artifact-id "$ARTIFACT_ID" --run-id "$REPLAY_RUN" --attempt "$REPLAY_ATTEMPT"
        --output replay
    - uses: actions/upload-artifact@v4
      id: upload
      if: ${{ inputs.replay_artifact_id != 0 && inputs.replay_artifact_id != null }}
      with:
        name: replay-${{ github.run_id }}-${{ github.run_attempt }}
        path: replay
        if-no-files-found: error
