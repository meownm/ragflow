[project]
name = "gvisor-sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "certifi>=2026.10.19",
    "fastapi>=0.135.0,<1",
    "httpx>=0.28.1",
    "pydantic>=2.11.4",
    "requests>=2.33.0,<3",
    "slowapi>=0.1.9",
    "uvicorn>=0.34.2",
]

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2,<5",
    "idna>=3.15,<4",
    "starlette>=1.3.1,<2",
    "urllib3>=2.8.0,<3",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[dependency-groups]
dev = [
    "basedpyright>=1.29.1",
]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
extend-select = ["C4", "SIM", "TCH"]
