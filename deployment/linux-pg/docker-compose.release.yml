services:
  plantuml-server:
    image: ${PLANTUML_IMAGE:-plantuml/plantuml-server:jetty-v1.2026.6}

  es01:
    image: ${ELASTICSEARCH_IMAGE:-elasticsearch:8.11.3}

  redis:
    image: ${VALKEY_IMAGE:-valkey/valkey:8}

  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-03-25T00-00-00Z}

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}

  ragflow-cpu:
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.26.4}
    depends_on: !override
      postgres:
        condition: service_healthy
      plantuml-server:
        condition: service_healthy
    ports: !override
      - "0.0.0.0:${SVR_WEB_HTTP_PORT:-80}:80"
    environment:
      RAGFLOW_CREDENTIALS_KEY: ${RAGFLOW_CREDENTIALS_KEY:?RAGFLOW_CREDENTIALS_KEY is required}

  t-one-asr:
    profiles: !override
      - t-one-disabled

  mysql:
    profiles: !override
      - mysql-disabled

  sandbox-executor-manager:
    profiles: !override
      - sandbox-disabled

  sandbox-runtime-bootstrap:
    profiles: !override
      - docker-desktop-only
