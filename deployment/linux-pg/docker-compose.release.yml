services:
  plantuml-server:
    image: ${PLANTUML_IMAGE:-plantuml/plantuml-server:jetty-v1.2026.6}

  es01:
    image: ${ELASTICSEARCH_IMAGE:-elasticsearch:8.11.3}

  redis:
    image: ${VALKEY_IMAGE:-valkey/valkey:8}

  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-03-25T00-00-00Z}

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}

  ragflow-cpu:
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.26.4}
    depends_on: !override
      postgres:
        condition: service_healthy
      plantuml-server:
        condition: service_healthy
    ports: !override
      - "0.0.0.0:${SVR_WEB_HTTP_PORT:-80}:80"
    environment:
      RAGFLOW_CREDENTIALS_KEY: ${RAGFLOW_CREDENTIALS_KEY:?RAGFLOW_CREDENTIALS_KEY is required}

  t-one-asr:
    image: ${T_ONE_ASR_IMAGE:-ragflow/t-one-asr:1.12.0}

  mysql:
    profiles: !override
      - mysql-disabled

  sandbox-executor-manager:
    profiles: !reset []
    image: ${SANDBOX_EXECUTOR_MANAGER_IMAGE:-infiniflow/sandbox-executor-manager:latest}

  sandbox-runtime-bootstrap:
    profiles: !override
      - docker-desktop-only

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.160.0}

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.10.5}

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.0}

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.11.0}

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.0}
