name: ragflow-qa
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_flow
      POSTGRES_USER: rag_flow
      POSTGRES_PASSWORD: ${QA_STORAGE_PASSWORD:?required}
    volumes:
      - qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rag_flow -d rag_flow"]
      interval: 5s
      retries: 30

  redis:
    image: valkey/valkey:8
    restart: unless-stopped
    environment:
      QA_STORAGE_PASSWORD: ${QA_STORAGE_PASSWORD:?required}
    command: [sh, -c, 'exec valkey-server --requirepass "$$QA_STORAGE_PASSWORD" --appendonly yes']
    volumes:
      - qa_redis:/data

  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    restart: unless-stopped
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: qa-storage
      MINIO_ROOT_PASSWORD: ${QA_STORAGE_PASSWORD:?required}
    volumes:
      - qa_objects:/data

  es01:
    image: elasticsearch:8.11.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    volumes:
      - qa_index:/usr/share/elasticsearch/data

  plantuml-server:
    image: plantuml/plantuml-server:jetty-v1.2026.6
    restart: unless-stopped

  app:
    image: ${RAGFLOW_IMAGE:?required}
    restart: unless-stopped
    entrypoint: [bash, /ragflow/entrypoint.sh]
    command: [--enable-adminserver, --init-superuser, --disable-datasync, --workers=1]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      es01:
        condition: service_started
      plantuml-server:
        condition: service_started
    ports:
      - '127.0.0.1:19382:80'
      - '127.0.0.1:19383:9381'
    environment:
      DB_TYPE: postgres
      DOC_ENGINE: elasticsearch
      API_PROXY_SCHEME: python
      POSTGRES_HOST: postgres
      POSTGRES_DBNAME: rag_flow
      POSTGRES_USER: rag_flow
      POSTGRES_PASSWORD: ${QA_STORAGE_PASSWORD:?required}
      MINIO_HOST: minio
      MINIO_USER: qa-storage
      MINIO_PASSWORD: ${QA_STORAGE_PASSWORD:?required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${QA_STORAGE_PASSWORD:?required}
      ES_HOST: es01
      USE_DOCLING: 'false'
      REGISTER_ENABLED: 'false'
      BUSINESS_DOCUMENT_WORKER_ENABLED: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      LLM_TIMEOUT_SECONDS: '180'
      WAIT_FOR_BACKEND_BEFORE_NGINX: 'true'
      RAGFLOW_BACKEND_READY_TIMEOUT_SECONDS: '300'
      DEFAULT_SUPERUSER_EMAIL: ${QA_ADMIN_EMAIL:?required}
      DEFAULT_SUPERUSER_PASSWORD: ${QA_ADMIN_PASSWORD:?required}
      MANAGED_RESOURCE_OWNER_EMAIL: ${QA_ADMIN_EMAIL:?required}
      QA_OLLAMA_URL: ${QA_OLLAMA_URL:?required}

volumes:
  qa_pgdata:
  qa_redis:
  qa_objects:
  qa_index:
