services:
  ragflow-cpu:
    command:
      - --enable-adminserver
      - --init-model-provider-tables
      - --init-superuser
    depends_on: !override
      postgres:
        condition: service_healthy
      plantuml-server:
        condition: service_healthy
    environment:
      # Disposable API suites create their own isolated test account.
      REGISTER_ENABLED: "1"
      LLM_TIMEOUT_SECONDS: "120"
      # Keep managed CI resources owned by that disposable account so the
      # provider-free REST suite can exercise them without seeded cloud users.
      MANAGED_RESOURCE_OWNER_EMAIL: "qa@infiniflow.org"

  mysql:
    profiles: !override
      - mysql-disabled

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DBNAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ragflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DBNAME}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
