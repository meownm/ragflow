server {
    listen 80;
    server_name your-ragflow-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-ragflow-domain.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    root /ragflow/web/dist;
    absolute_redirect off;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;

    location = /asr {
        return 308 /asr/;
    }
    location ^~ /asr/ {
        resolver 127.0.0.11 valid=30s;
        set $asr_upstream t-one-asr:9011;
        rewrite ^/asr/(.*)$ /$1 break;
        proxy_pass http://$asr_upstream;
        include proxy.conf;
    }

    location = /translate {
        return 308 /translate/;
    }
    location = /translate/address-form {
        return 308 /translate/address-form/;
    }
    location ^~ /translate/address-form/ {
        proxy_pass http://host.docker.internal:8094;
        include proxy.conf;
    }
    location ^~ /address-api/ {
        proxy_pass http://host.docker.internal:8094;
        include proxy.conf;
    }
    location ^~ /translate/ {
        proxy_pass http://host.docker.internal:8092;
        include proxy.conf;
    }

    location ~ ^/api/v1/admin {
        proxy_pass http://localhost:9381;
        include proxy.conf;
    }

    location ~ ^/(v1|api) {
        proxy_pass http://localhost:9380;
        include proxy.conf;
    }

    location ^~ /plantuml/ {
        proxy_pass http://plantuml-server:8080/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }


    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(assets|entry|chunk)/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }
}
