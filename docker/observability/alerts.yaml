groups:
  - name: ragflow-observability
    rules:
      - alert: RAGFlowHighErrorRate
        expr: sum(rate(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m])) / clamp_min(sum(rate(traces_span_metrics_calls_total[5m])), 1) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: RAGFlow error rate is above 5%
      - alert: RAGFlowP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket[5m]))) > 5000
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: RAGFlow p95 span latency is above 5 seconds
      - alert: TelemetryBackendDown
        expr: up{job=~"otel-collector|tempo|loki"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: An observability backend is unavailable
