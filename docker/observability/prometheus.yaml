global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888, otel-collector:8889]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
